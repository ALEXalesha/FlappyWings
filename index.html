    const b = (list) => list.map((k) => `<b>${k}</b>`);
    const pause = b(keysOf('pause').concat('Esc'));
    return `<p>Птичка летит сама, а вы машете крыльями: ${b(keysOf('flap').concat('W')).join(', ')}, клик мышью или касание экрана. Каждый взмах подбрасывает вверх, сила тяжести тянет вниз.</p>
    <p>Пролетите между колоннами - очко. Задели колонну или землю - полёт окончен. С каждой колонной просвет чуть уже, а полёт чуть быстрее.</p>
    <p>Медали за один полёт: бронзовое перо - 10 очков, серебряное - 25, золотое - 50, платиновое - 100.</p>
    <p>${pause.slice(0, -1).join(', ')} или ${pause[pause.length - 1]} - пауза, <b>R</b> - заново, <b>M</b> - звук, <b>T</b> - светлая или тёмная тема. Клавиши взмаха и паузы меняются в настройках. Кнопки звука и темы есть и в углу игры. Игра встаёт на паузу сама, если окно или вкладку скрыть.</p>`;
  },
  credits: `<p><b>Летучая птичка / Flappy Wings</b> - фан-игра в жанре «пролети между колоннами». Не связана с авторами и правообладателями известных игр этого жанра.</p>
    <p>Код, рисунки и музыка сделаны прямо в странице: птичка, колонны и пейзаж рисуются кодом, звуки синтезируются WebAudio. Ни одного файла из интернета, игра работает без сети.</p><p>Часть «Игротеки».</p>`,
  drawLogo(g, w, h, t) {
    const keep = ctx;
    ctx = g;
    drawBirdAt(62, 70 + Math.sin(t * 4) * 9, { angle: Math.sin(t * 4 + 1) * 0.15, wing: t * 14, scale: 1.9 });
    ctx = keep;
    const grd = g.createLinearGradient(0, 20, 0, 100);
    grd.addColorStop(0, '#9be3ff'); grd.addColorStop(1, '#2b8fd6');
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    let size = 46;
    g.font = `bold ${size}px "Segoe UI", Arial, sans-serif`;
    const tw = g.measureText('ЛЕТУЧАЯ ПТИЧКА').width;
    if (tw > 340) { size = Math.floor(size * 340 / tw); g.font = `bold ${size}px "Segoe UI", Arial, sans-serif`; }
    g.lineWidth = 7; g.strokeStyle = '#123456'; g.strokeText('ЛЕТУЧАЯ ПТИЧКА', 295, 58);
    g.fillStyle = grd; g.fillText('ЛЕТУЧАЯ ПТИЧКА', 295, 58);
    g.font = 'bold 22px "Segoe UI", Arial, sans-serif';
    g.lineWidth = 5; g.strokeStyle = '#123456'; g.strokeText('Flappy Wings', 295, 102);
    g.fillStyle = '#ffd25e'; g.fillText('Flappy Wings', 295, 102);
  },
  game: {
    menuItems() {
      return [
        { label: 'Играть', primary: true, id: 'play', onClick: start },
        { label: 'Тема: ' + THEME_NAMES[kit.settings.theme], id: 'theme', onClick: () => {
          cycleTheme(); kit.showMain();
          const b = document.querySelector('[data-screen=main] [data-id=theme]'); if (b) b.focus();
        } },
      ];
    },
    onRestart() { start(); },
    onQuit() { startDemo(); },
    onRelease() { pointerTap = false; wTap = false; },
    onResetProgress() { loadRecords(); },
    onSettings(s) { if (!kit) return; applyTheme(); applySound(s); },
    recordsHtml() {
      const b = records.best;
      return `<table>
        <tr><td>Рекорд</td><td>${['easy', 'normal', 'hard'].map((d) => `${DIFF_LOWER[d]} <b>${b[d] || 0}</b>`).join(' · ')}</td></tr>
        <tr><td>Медали</td><td>${MEDALS.slice().reverse().map((m) => `${m.icon} ${records.medals[m.id] || 0}`).join(' &nbsp; ')}</td></tr>
        <tr><td>Полётов</td><td>${records.games}</td></tr>
        <tr><td>Всего очков / взмахов</td><td>${records.total} / ${records.flaps}</td></tr></table>`;
    },
  },
});
applyTheme();

// ================= Цикл: шаги мира по часам, рисование по кадрам =================
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP_MS) {
    if (!manual) {
      const live = (kit.mode === 'play' && state.mode === 'run') || (kit.mode === 'menu' && state.mode === 'demo');
      if (live) update();
      kit.endStep();
    }
    acc -= STEP_MS;
  }
  render();
  kit.countFrame();
  requestAnimationFrame(loop);
}
addEventListener('resize', fitCanvas);
loadRecords();
fitCanvas();
startDemo();
kit.showMain();
requestAnimationFrame(loop);

// ================= Крючок для проверок =================
window.__game = {
  ready: true,
  VH, GROUND, BIRD_X, BIRD_R, COL_W, CAP_W, SPACING, GRAVITY, FLAP_V, LIMITS, MEDALS,
  state, bird, columns, records,
  get kit() { return kit; },
  get autopilot() { return autopilot; },
  get theme() { return themeName(); },
  get viewW() { return VW; },
  get manual() { return manual; },
  set manual(v) { manual = !!v; },
  // n шагов мира по 1/60 с (как настоящий цикл: шаг и «съеденные» нажатия)
  step(n = 1, draw = true) { for (let i = 0; i < n; i++) { update(); kit.endStep(); } if (draw) render(); },
  flap() { pointerTap = true; },          // взмах, как от клика: сработает на следующем шаге
  start, startDemo, toggleSound, toggleTheme, cycleTheme,
  gapFor, speedFor, medalFor, collidingColumn, spawnColumn,
  setAutopilot(v) { autopilot = !!v; },
  clearColumns() { columns.length = 0; state.noSpawn = true; },
  // колонна на dx единиц впереди птички с просветом вокруг center
  addColumn(dx, center, gap = 160, kind = 'stone') { const c = { x: birdWorldX() + dx, center, gap, kind, n: 0, passed: false }; columns.push(c); return c; },
  hudButtonCss(id) {
    const b = HUD_BTNS().find((q) => q.id === id), r = canvas.getBoundingClientRect();
    return { x: r.left + b.x * r.width / VW, y: r.top + b.y * r.height / VH };
  },
};
</script>
